<style>
    /* Add this to your CSS for a legendary terminal look */
    #user-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: #444; font-style: italic; }
</style>

<script>
    const check = document.getElementById('legal-check');
    const unlockBtn = document.getElementById('unlock-btn');
    const wrapper = document.getElementById('terminal-wrapper');
    const overlay = document.getElementById('gate-overlay');
    const inputField = document.getElementById('user-input');

    // Enable/Disable Unlock Button
    check.onchange = () => {
        unlockBtn.disabled = !check.checked;
        unlockBtn.style.opacity = check.checked ? "1" : "0.3";
    };

    function unlockTerminal() {
        wrapper.style.filter = "none";
        wrapper.style.pointerEvents = "auto";
        overlay.style.opacity = "0";
        setTimeout(() => {
            overlay.style.display = "none";
            inputField.focus();
        }, 500);
        appendLog("SYSTEM", "ACCESS GRANTED. WELCOME FOUNDER.", "#6dc86d");
    }

    // --- ENHANCED AI FETCH LOGIC ---
    inputField.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const query = inputField.value.trim();
            if (!query) return;

            // 1. Show User Message & Lock Input
            appendLog("USER", query, "#fff");
            inputField.value = "";
            inputField.disabled = true;

            // 2. Show Typing Indicator
            const typingId = "msg-" + Date.now();
            const log = document.getElementById("chat-log");
            log.innerHTML += `<div id="${typingId}" class="typing">> PROTON#: Thinking...</div>`;
            log.scrollTop = log.scrollHeight;

            try {
                const response = await fetch("/.netlify/functions/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: query })
                });

                const data = await response.json();
                
                // Remove Typing Indicator
                document.getElementById(typingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiContent = data.choices[0].message.content;
                    appendLog("PROTON#", aiContent, "#a855f7");
                } else {
                    throw new Error(data.error?.message || "Empty response from AI_CORE");
                }

            } catch (err) {
                if (document.getElementById(typingId)) document.getElementById(typingId).remove();
                appendLog("SYSTEM", `UPLINK_ERROR: ${err.message}`, "#ff4444");
            } finally {
                inputField.disabled = false;
                inputField.focus();
            }
        }
    });

    function appendLog(role, text, color) {
        const log = document.getElementById("chat-log");
        // Convert newlines to <br> so the terminal respects formatting
        const formattedText = text.replace(/\n/g, '<br>');
        log.innerHTML += `<div style="margin-bottom: 12px; color: ${color}; line-height: 1.4;">> ${role}: ${formattedText}</div>`;
        log.scrollTop = log.scrollHeight;
    }
</script>
