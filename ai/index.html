<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton# | AI_CORE</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; 
            --panel: #0a0a0a; 
            --border: #1a1a1a;
            --proton-orange: #ff8c00; 
            --pro-purple: #a855f7; 
            --mono: 'JetBrains Mono', monospace;
        }
        body, html { background: var(--bg); color: var(--proton-orange); font-family: var(--mono); margin: 0; height: 100vh; overflow: hidden; }
        #terminal-wrapper { display: flex; flex-direction: column; height: 100vh; padding: 40px; box-sizing: border-box; transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1); filter: blur(25px); pointer-events: none; }
        #gate-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.6s ease, visibility 0.6s; }
        .gate-card { background: var(--panel); border: 1px solid var(--pro-purple); padding: 40px; border-radius: 12px; text-align: center; max-width: 450px; box-shadow: 0 0 50px rgba(168, 85, 247, 0.2); }
        #unlock-btn { background: var(--pro-purple); color: #fff; border: none; padding: 12px 30px; font-family: var(--mono); font-weight: 800; cursor: pointer; margin-top: 25px; opacity: 0.3; transition: 0.3s; }
        #unlock-btn:not([disabled]) { opacity: 1; box-shadow: 0 0 20px var(--pro-purple); }
        #chat-log { flex: 1; overflow-y: auto; margin-bottom: 20px; font-size: 0.95rem; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 15px; border-top: 1px solid var(--border); padding-top: 20px; align-items: center;}
        input#user-input { flex: 1; background: transparent; border: none; color: #fff; font-family: var(--mono); outline: none; font-size: 1rem; }
        input#user-input:disabled { opacity: 0.3; }
        .typing-msg { color: #555; font-style: italic; margin-bottom: 12px; }
        a { text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div id="gate-overlay">
    <div class="gate-card">
        <h2 style="color: var(--pro-purple); margin-top:0;">AI_CORE ACCESS</h2>
        <p style="color: #666; font-size: 0.8rem; margin-bottom: 25px;">[VERIFICATION REQUIRED]</p>
        <label style="font-size: 0.85rem; color: #bbb; cursor: pointer; display: block; line-height: 1.4;">
           input type="checkbox" id="legal-check"> 
            I confirm I am 13+ and reviewed the <a href="https://protonlanguage.github.io" target="_blank" style="color:var(--proton-orange)">Proton# Docs</a>.
        </label>
        <button id="unlock-btn" disabled>UNLOCK_TERMINAL</button>
    </div>
</div>

<div id="terminal-wrapper">
    <div id="chat-log">
        <div style="color: var(--pro-purple)">[SYSTEM]: UPLINK_ESTABLISHED. CLOUDFLARE_ACTIVE.</div>
        <div style="color: #444;">> Waiting for authorization...</div>
    </div>
    <div class="input-area">
        <span style="color: var(--pro-purple); font-weight: bold;">$</span>
        <input type="text" id="user-input" placeholder="Initiate sequence..." autocomplete="off">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const check = document.getElementById('legal-check');
    const unlockBtn = document.getElementById('unlock-btn');
    const wrapper = document.getElementById('terminal-wrapper');
    const overlay = document.getElementById('gate-overlay');
    const inputField = document.getElementById('user-input');
    const log = document.getElementById("chat-log");

    check.onchange = () => { unlockBtn.disabled = !check.checked; };

    unlockBtn.onclick = () => {
        wrapper.style.filter = "none";
        wrapper.style.pointerEvents = "auto";
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.style.display = "none"; inputField.focus(); }, 600);
        appendLog("SYSTEM", "ACCESS GRANTED. WELCOME USER.", "#6dc86d");
    };

    inputField.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const query = inputField.value.trim();
            if (!query) return;

            appendLog("USER", query, "#fff");
            inputField.value = "";
            inputField.disabled = true;

            const typingId = "msg-" + Date.now();
            log.innerHTML += `<div id="${typingId}" class="typing-msg">> PROTON#: Thinking...</div>`;
            log.scrollTop = log.scrollHeight;

            try {
                // CHANGED: Pointing to Cloudflare path
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: query })
                });

                if (!response.ok) throw new Error(`HTTP_${response.status}`);
                const data = await response.json();
                
                document.getElementById(typingId)?.remove();

                if (data.choices && data.choices[0]) {
                    appendLog("PROTON#", data.choices[0].message.content, "#a855f7");
                } else {
                    throw new Error("UNEXPECTED_DATA");
                }

            } catch (err) {
                document.getElementById(typingId)?.remove();
                appendLog("SYSTEM", `UPLINK_FAILURE: ${err.message}`, "#ff4444");
            } finally {
                inputField.disabled = false;
                inputField.focus();
            }
        }
    });

    function appendLog(role, text, color) {
        const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        log.innerHTML += `<div style="margin-bottom: 14px; color: ${color}; line-height: 1.5;">> ${role}: ${safeText.replace(/\n/g, '<br>')}</div>`;
        log.scrollTop = log.scrollHeight;
    }
});
</script>
</body>
</html>
